server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/plain application/xml application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Temiz URL'ler: /mcp/tools -> /mcp/tools.html. `.html` uzantılı adres de çalışır
  # ama canonical etiketi temiz adresi gösteriyor.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location /assets/ {
    expires 1h;
    add_header Cache-Control "public";
  }

  # llms dosyaları: düz metin, açık CORS (tarayıcıdaki araçlar da okuyabilsin).
  location ~ ^/(llms\.txt|llms-full\.txt)$ {
    default_type "text/plain; charset=utf-8";
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=3600";
  }

  location = /health { default_type text/plain; return 200 "ok\n"; }

  error_page 404 /404.html;
}
